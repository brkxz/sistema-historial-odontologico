services:
  - type: web
    name: odonto-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RENIEC_API_TOKEN
        sync: false
      - key: APIPERU_DEV_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
