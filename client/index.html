<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230369A1'/><path d='M16 5c-3.5 0-8 2.5-8 8 0 3 1 5.5 2 8.5 1 3 2 5.5 3 5.5s1.5-2 2-5l.5-3 .5 3c.5 3 1 5 2 5s2-2.5 3-5.5c1-3 2-5.5 2-8.5C23 7.5 19.5 5 16 5z' fill='white'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Sistema de Historial Odontológico Digital - Hospital San Ramón, Chanchamayo" />
    <meta name="theme-color" content="#0D9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OdontoApp" />
    <link rel="apple-touch-icon" href="/icon-512x512.png" />
    <!-- Preload critical font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- FontAwesome Icons (Landing Page) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <title>Servicio de Odontología | Hospital San Ramón</title>
    <style>
      /* Splash limpio — fondo blanco sin burbujas */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 99999;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      #app-loader .loader-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0369A1, #0891B2);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
        box-shadow: 0 6px 24px rgba(3, 105, 161, 0.2);
      }
      #app-loader .loader-icon svg {
        width: 26px;
        height: 26px;
        color: white;
      }
      #app-loader .loader-bar {
        width: 140px;
        height: 2px;
        background: #E2E8F0;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 6px;
      }
      #app-loader .loader-bar-inner {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #0369A1, #0891B2);
        border-radius: 2px;
        animation: loader-slide 1s ease-in-out infinite;
      }
      #app-loader .loader-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
        color: #94A3B8;
        margin-top: 10px;
        letter-spacing: 0.03em;
      }
      @keyframes loader-slide {
        0%   { transform: translateX(-200%); }
        100% { transform: translateX(600%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant loader: visible before React mounts, then auto-hidden -->
      <div id="app-loader">
        <div class="loader-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/>
            <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/>
            <circle cx="20" cy="10" r="2"/>
          </svg>
        </div>
        <div class="loader-bar">
          <div class="loader-bar-inner"></div>
        </div>
        <p class="loader-text">Iniciando sistema...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Despertar servidor y forzar limpieza de cache viejo -->
    <script>
      // 1. Desregistrar Service Workers viejos para evitar que sirvan JS obsoleto
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister(); });
        });
      }
      // 2. Limpiar caches del navegador (versiones viejas atrapan JS roto)
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) { caches.delete(key); });
        });
      }
      // 3. Ping al servidor Render para despertar cold start
      fetch('https://odontologia-api-9a6v.onrender.com/api/health', {
        method: 'GET', mode: 'no-cors'
      }).catch(function() {});
      // 4. Safety timeout: si React no monta en 6s, recargar la pagina
      window.__splashTimeout = setTimeout(function() {
        var loader = document.getElementById('app-loader');
        if (loader && loader.parentNode) {
          // Si el loader sigue ahi a los 6s, puede haber un JS roto en cache
          // Recargamos forzando bypass de cache
          window.location.reload(true);
        }
      }, 6000);
    </script>
  </body>
</html>
