<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background subtle pattern -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F9FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369A1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0369A1" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="120" fill="url(#bgGrad)" opacity="0.5"/>
  <circle cx="150" cy="100" r="40" fill="#BFDBFE" opacity="0.3"/>
  <circle cx="280" cy="180" r="30" fill="#93C5FD" opacity="0.2"/>
  
  <!-- Main tooth illustration -->
  <g filter="url(#shadow)">
    <!-- Tooth body -->
    <path d="M200 60 C160 60 140 90 140 120 C140 140 145 160 150 180 C155 200 160 230 170 250 C180 270 195 275 200 275 C205 275 220 270 230 250 C240 230 245 200 250 180 C255 160 260 140 260 120 C260 90 240 60 200 60 Z" 
          fill="url(#toothGrad)" 
          stroke="#0369A1" 
          stroke-width="2"/>
    
    <!-- Tooth details - roots -->
    <path d="M170 250 C165 260 160 270 155 280" stroke="#0369A1" stroke-width="2" stroke-linecap="round"/>
    <path d="M230 250 C235 260 240 270 245 280" stroke="#0369A1" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Tooth crown line -->
    <path d="M155 120 Q200 110 245 120" stroke="#0369A1" stroke-width="1.5" fill="none" opacity="0.3"/>
    
    <!-- Shine effect -->
    <ellipse cx="175" cy="100" rx="15" ry="20" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Medical cross/shield overlay -->
  <g transform="translate(260, 60)">
    <circle cx="30" cy="30" r="28" fill="url(#shieldGrad)" filter="url(#shadow)"/>
    <path d="M30 15 L35 25 L45 25 L37 32 L40 42 L30 35 L20 42 L23 32 L15 25 L25 25 Z" 
          fill="white" 
          transform="scale(0.8) translate(7, 7)"/>
  </g>
  
  <!-- Sparkle decorations -->
  <g fill="#0369A1">
    <circle cx="120" cy="80" r="3" opacity="0.4"/>
    <circle cx="290" cy="100" r="2" opacity="0.5"/>
    <circle cx="100" cy="200" r="2" opacity="0.3"/>
    <circle cx="310" cy="220" r="3" opacity="0.4"/>
  </g>
  
  <!-- Floating elements -->
  <path d="M80 150 Q90 140 100 150 Q110 160 120 150" stroke="#0369A1" stroke-width="1" fill="none" opacity="0.2"/>
  <path d="M280 80 Q290 70 300 80 Q310 90 320 80" stroke="#0369A1" stroke-width="1" fill="none" opacity="0.2"/>
</svg>
