name: Keep Render Backend Alive

on:
  schedule:
    # Ping every 5 minutes (24/7) to prevent Render Free Tier cold starts
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging Render backend to keep it alive..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://odontologia-api-9s6v.onrender.com/api/health)
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is alive and responding!"
          else
            echo "⚠️ Backend returned status: $STATUS (may be warming up)"
          fi
